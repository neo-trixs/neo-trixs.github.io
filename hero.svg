<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#f3e9d0"/>
    </radialGradient>
    <linearGradient id="axis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fff6de" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#b45309" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- App-style canvas -->
  <rect width="720" height="520" rx="28" fill="url(#bg)"/>

  <!-- Subtle warm grid -->
  <g opacity="0.5" stroke="#d97706" stroke-width="0.4">
    <line x1="40" y1="160" x2="680" y2="160"/>
    <line x1="40" y1="260" x2="680" y2="260"/>
    <line x1="40" y1="360" x2="680" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="480"/>
    <line x1="360" y1="40" x2="360" y2="480"/>
    <line x1="520" y1="40" x2="520" y2="480"/>
  </g>

  <!-- E8 hexagram: 6 stacked reasoning axes (64 states), warm amber -->
  <g opacity="0.35" stroke="url(#axis)" stroke-width="1.4">
    <line x1="260" y1="120" x2="460" y2="120"/>
    <line x1="240" y1="160" x2="480" y2="160"/>
    <line x1="260" y1="200" x2="460" y2="200"/>
    <line x1="240" y1="240" x2="480" y2="240"/>
    <line x1="260" y1="280" x2="460" y2="280"/>
    <line x1="240" y1="320" x2="480" y2="320"/>
    <line x1="260" y1="360" x2="460" y2="360"/>
    <line x1="240" y1="400" x2="480" y2="400"/>
  </g>

  <!-- Active reasoning path -->
  <g fill="none" stroke="url(#hg)" stroke-width="3" opacity="0.95" filter="url(#drop)">
    <circle cx="360" cy="120" r="11" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
    <path d="M360 131 L390 189"/>
    <circle cx="390" cy="200" r="9" fill="#e8833a"/>
    <path d="M390 209 L330 271"/>
    <circle cx="330" cy="280" r="9" fill="#d97706"/>
    <path d="M330 289 L420 351"/>
    <circle cx="420" cy="360" r="11" fill="#b45309" stroke="#fff" stroke-width="1.5"/>
    <path d="M420 352 L360 392" stroke-dasharray="5 5" opacity="0.5"/>
  </g>

  <!-- Glow behind active path -->
  <circle cx="360" cy="260" r="120" fill="#f59e0b" opacity="0.08" filter="url(#soft)"/>

  <!-- HyperCube: floating app tiles (right side) -->
  <g filter="url(#drop)">
    <rect x="540" y="90" width="120" height="84" rx="14" fill="url(#panel)" stroke="#d97706" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="556" y="104" width="88" height="6" rx="3" fill="#f59e0b" opacity="0.5"/>
    <rect x="556" y="118" width="70" height="5" rx="2.5" fill="#d97706" opacity="0.22"/>
    <rect x="556" y="130" width="80" height="5" rx="2.5" fill="#d97706" opacity="0.16"/>
    <rect x="556" y="142" width="60" height="5" rx="2.5" fill="#d97706" opacity="0.12"/>
  </g>

  <g filter="url(#drop)">
    <rect x="570" y="210" width="104" height="72" rx="14" fill="url(#panel)" stroke="#d97706" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="592" cy="236" r="8" fill="#f59e0b" opacity="0.8"/>
    <circle cx="612" cy="236" r="8" fill="#e8833a" opacity="0.7"/>
    <circle cx="632" cy="236" r="8" fill="#d97706" opacity="0.6"/>
    <rect x="586" y="256" width="72" height="5" rx="2.5" fill="#d97706" opacity="0.2"/>
  </g>

  <g filter="url(#drop)">
    <rect x="548" y="320" width="116" height="80" rx="14" fill="url(#panel)" stroke="#d97706" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="564" y="336" width="84" height="10" rx="4" fill="url(#hg)" opacity="0.75"/>
    <rect x="564" y="354" width="64" height="6" rx="3" fill="#d97706" opacity="0.2"/>
    <rect x="564" y="368" width="76" height="6" rx="3" fill="#d97706" opacity="0.15"/>
    <rect x="564" y="382" width="52" height="6" rx="3" fill="#d97706" opacity="0.12"/>
  </g>

  <!-- Connective vector lines to HyperCube -->
  <g stroke="#d97706" stroke-width="1.2" opacity="0.35" stroke-dasharray="3 4">
    <line x1="600" y1="174" x2="622" y2="210"/>
    <line x1="622" y1="282" x2="606" y2="320"/>
  </g>

  <!-- Bottom status chip (app style) -->
  <g>
    <rect x="260" y="440" width="200" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1" stroke-opacity="0.3" filter="url(#drop)"/>
    <circle cx="280" cy="455" r="4" fill="#16a34a"/>
    <text x="296" y="459" font-family="monospace" font-size="12" fill="#92400e" letter-spacing="1">SIGNAL · EVOLVING</text>
  </g>
</svg>
