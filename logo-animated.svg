<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9ef"/>
      <stop offset="50%" stop-color="#fbf3de"/>
      <stop offset="100%" stop-color="#fdf9ef"/>
    </linearGradient>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d97706" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="720" height="200" fill="url(#bg)"/>
  <rect width="720" height="200" fill="url(#grid)"/>

  <!-- Diamond logo (E8 core) -->
  <polygon points="100,100 130,60 160,100 130,140" fill="url(#pg)" filter="url(#drop)"/>
  <polygon points="100,100 130,65 160,100 130,135" fill="#ffffff" opacity="0.25"/>
  <!-- Hexagram hint below diamond -->
  <g stroke="#d97706" stroke-width="1.5" opacity="0.4">
    <line x1="112" y1="152" x2="148" y2="152"/>
    <line x1="116" y1="158" x2="144" y2="158"/>
    <line x1="120" y1="164" x2="140" y2="164"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="95" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="4" fill="#262419">Neo<span fill="#d97706" font-weight="400">—</span>TRIX</text>
  <text x="200" y="125" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#8a7b55">The Agent That Learns to Think</text>

  <!-- Stats -->
  <text x="200" y="155" font-family="monospace" font-size="9" fill="#a38a5a" letter-spacing="1">474K+ LOC · 8,771 tests · 0 unsafe · 7 domains</text>

  <!-- Signal dots (warm amber) -->
  <circle cx="620" cy="60" r="2" fill="#d97706" opacity="0.3"/>
  <circle cx="635" cy="60" r="2.5" fill="#d97706" opacity="0.6"/>
  <circle cx="652" cy="60" r="3" fill="#f59e0b" opacity="0.9"/>
  <circle cx="671" cy="60" r="2" fill="#d97706" opacity="0.5"/>
</svg>
