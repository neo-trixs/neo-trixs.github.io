<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="100%" stop-color="#f3e5c0"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#sg)"/>

  <!-- Outer square -->
  <rect x="20" y="20" width="80" height="80" rx="10" fill="none" stroke="url(#pg)" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner rotated square (tesseract / HyperCube) -->
  <rect x="35" y="35" width="50" height="50" rx="6" fill="none" stroke="url(#pg)" stroke-width="1.5" opacity="0.55"
        transform="rotate(45 60 60)"/>
  <!-- Diamond core (E8) -->
  <polygon points="60,28 78,60 60,92 42,60" fill="url(#pg)" filter="url(#glow)"/>
  <polygon points="60,36 72,60 60,84 48,60" fill="#ffffff" opacity="0.3"/>

  <!-- Hexagram hint (6 lines) -->
  <g stroke="#92400e" stroke-width="1" opacity="0.35">
    <line x1="66" y1="30" x2="74" y2="30"/>
    <line x1="66" y1="34" x2="74" y2="34"/>
    <line x1="66" y1="38" x2="74" y2="38"/>
    <line x1="66" y1="42" x2="74" y2="42"/>
    <line x1="66" y1="46" x2="74" y2="46"/>
    <line x1="66" y1="50" x2="74" y2="50"/>
  </g>

  <!-- Circuit traces -->
  <line x1="20" y1="60" x2="42" y2="60" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <line x1="78" y1="60" x2="100" y2="60" stroke="#b45309" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="20" x2="60" y2="35" stroke="#d97706" stroke-width="0.8" opacity="0.5"/>
  <line x1="60" y1="85" x2="60" y2="100" stroke="#b45309" stroke-width="0.8" opacity="0.5"/>
</svg>
